# Generated by gatedist from swazona/swazona@1e5333d8e00f8c4f9864c5c039655686543129fd v1.0.0. Do not edit.
name: 'swazona-gate'
description: >-
  Tier-D deterministic code review over a pull request's diff, published as
  a GitHub check run named "swazona-gate" with one annotation per finding,
  plus customer-verifiable evidence: a check summary, one updatable PR
  comment, and a swazona-evidence.json artifact (attested with GitHub
  artifact attestations on public repositories when enabled). Fails closed:
  an unreadable ruleset, an unobtainable diff, or a GitHub API error is
  reported as conclusion `failure`, never skipped.
author: 'swazona'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  repo-dir:
    description: 'Repository working directory to diff. Must be an absolute path (or resolvable from the runner''s own working directory) — it is passed to `git diff` from inside gate-action''s own step, not the checkout root.'
    required: false
    default: ${{ github.workspace }}
  rules:
    description: >-
      Optional path, relative to repo-dir, to a custom Tier-D rule registry.
      A PR must not be able to change the rules that check it: when set,
      this path is read from the BASE commit (`git show <base>:<path>`),
      never from the head checkout on disk. Leave unset to use the ruleset
      bundled inside this Action (gate-action/rules/default.yml), which a
      PR cannot edit either way.
    required: false
    default: ''
  base:
    description: 'Base ref/SHA to diff against.'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: 'Head ref/SHA to diff (the PR''s tip).'
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  github-token:
    description: 'Token used to write the check run. Needs the `checks: write` permission.'
    required: false
    default: ${{ github.token }}
  license:
    description: >-
      Swazona license key (SWAZONA_LICENSE). If set, it is always verified,
      and an invalid or expired key fails the check. If unset, the check
      runs free on github.com for public repositories only; every private
      or internal repository needs a license, including a private
      repository on a personal account.
    required: false
    default: ''
  dry-run:
    description: >-
      If "true", nothing is published: the gate writes its would-be payloads
      and the evidence under the run directory instead of touching GitHub.
      Used by this repo's self-test workflow; a real consumer should leave
      this at the default.
    required: false
    default: 'false'
  mode:
    description: 'One of `enforce` (findings fail the check) or `shadow` (findings are reported, the check stays neutral).'
    required: false
    default: 'shadow'
  block-on-model-findings:
    description: 'If "true", a run whose model tiers could not execute concludes failure (S3 fail-closed on model incompleteness).'
    required: false
    default: 'false'
  finder-model:
    description: 'Finder model id, e.g. anthropic/claude-haiku-4-5-20251001. Empty disables the model tiers.'
    required: false
    default: ''
  refuter-model:
    description: 'Refuter model id. Defaults to the finder model when empty.'
    required: false
    default: ''
  finder-price:
    description: 'Finder price per million input tokens, e.g. "1.00". Required with finder-model.'
    required: false
    default: ''
  refuter-price:
    description: 'Refuter price per million input tokens. Defaults to the finder price when empty.'
    required: false
    default: ''
  max-model-usd:
    description: 'Hard cap on model spend per run, in USD.'
    required: false
    default: '2.00'
  anthropic-api-key:
    description: 'API key for the Anthropic provider (pass via secrets). Never echoed.'
    required: false
    default: ''
  openai-api-key:
    description: 'API key for the OpenAI provider (pass via secrets). Never echoed.'
    required: false
    default: ''
  anthropic-base-url:
    description: 'Optional Anthropic-compatible endpoint override.'
    required: false
    default: ''
  openai-base-url:
    description: 'Optional OpenAI-compatible endpoint override.'
    required: false
    default: ''
  attest:
    description: >-
      Artifact attestation for swazona-evidence.json: `auto` (attempt on
      public repositories with id-token permission; record the reason and
      continue otherwise), `true` (required — a failed or unavailable
      attestation fails the run), or `false` (skip).
    required: false
    default: 'auto'
  pr-number:
    description: 'Pull request number for the evidence comment. Empty → no comment.'
    required: false
    default: ${{ github.event.pull_request.number }}
  comment-author:
    description: 'Login whose marker comments the action keeps current (must be a Bot type account).'
    required: false
    default: 'github-actions[bot]'

outputs:
  run-dir:
    description: 'Per-invocation directory under the runner temp holding result.json, swazona-evidence.json and the dry-run sidecars.'
    value: ${{ steps.prep.outputs.run_dir }}
  invocation-id:
    description: 'This invocation''s id: <GITHUB_RUN_ID>-<GITHUB_RUN_ATTEMPT>-<32 hex>.'
    value: ${{ steps.prep.outputs.invocation_id }}
  evidence-sha256:
    description: 'sha256 of swazona-evidence.json (also the attestation subject digest).'
    value: ${{ steps.evidence.outputs.sha256 }}

runs:
  using: 'composite'
  steps:
    # Every `${{ }}` expression lives in `env:`/`with:`/`if:` — never inside a
    # `run:` block (no input interpolation into shell, github-action-03).
    # Exit codes come only from `go build -o` binaries, never `go run` (B09).

    - name: Prepare invocation
      id: prep
      shell: bash
      env:
        IN_MODE: ${{ inputs.mode }}
        IN_BLOCK_MODEL: ${{ inputs.block-on-model-findings }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
        IN_ATTEST: ${{ inputs.attest }}
      run: |
        set -euo pipefail
        sanitize() { printf '%s' "$1" | sed 's/[^A-Za-z0-9._-]/?/g' | cut -c1-40; }
        check_input() { # name, value, space-separated set
          name="$1"; value="$2"; set="$3"
          for ok in $set; do
            if [ "$value" = "$ok" ]; then return 0; fi
          done
          echo "::error::swazona-gate: input $name must be one of $set (got $(sanitize "$value"))"
          exit 2
        }
        check_input mode "$IN_MODE" "shadow enforce"
        check_input block-on-model-findings "$IN_BLOCK_MODEL" "true false"
        check_input dry-run "$IN_DRY_RUN" "true false"
        check_input attest "$IN_ATTEST" "auto true false"
        if [ "$IN_DRY_RUN" = "true" ] && [ "$IN_ATTEST" = "true" ]; then
          echo "::error::swazona-gate: dry-run and attest=true cannot be combined (nothing would be attested)"
          exit 2
        fi
        INV="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        RUN_DIR="$RUNNER_TEMP/swazona-gate-$INV"
        mkdir -p "$RUN_DIR"
        rm -rf "$RUNNER_TEMP/swazona-gate-cache"
        mkdir -p "$RUNNER_TEMP/swazona-gate-cache"
        echo "invocation_id=$INV" >> "$GITHUB_OUTPUT"
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

    - name: Install verified tools
      id: build
      shell: bash
      env:
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWZ_DIST_REPO: swazona/gate
        SWZ_DIST_VERSION: v1.0.0
        SWZ_DIST_PUBKEY_HEX: ee3d451f355dbc7c8908cde8d6cdda940646391922a5005ab89a221e033de6fb
        SWZ_DIST_SHA256SUMS: |
          # swazona-gate-release v1.0.0 source=1e5333d8e00f8c4f9864c5c039655686543129fd
          afff31116fde83444b1856cb919505f7afc10e0725ffccddde2b10c40eb0d324  swazona-evidence-darwin-arm64
          96ed8050c905cc86841efdbc4f2d72495a41e2ff3141900d4a706c33f0cd9828  swazona-evidence-linux-amd64
          744ed0d0428b5c2df77300e7b6f58db3b7623286f6d7755c57cfd901e241745e  swazona-evidence-linux-arm64
          b6e97d78b94f6079a5b7d67feffacf5878f779aaeeb7dda4d8f955261e448398  swazona-gate-darwin-arm64
          01de40036bc102a84d887e04dfc047d53d6a896596b52356d36b6b2ad33d36a8  swazona-gate-linux-amd64
          a9f702668151c91ad792376ecb2bd091e5f5e99a4d4bbf6f9d7385c2bcd70510  swazona-gate-linux-arm64
          b1bf8eead3ff564cc343dd25b7218df9bf1fc68a01ea6d40ada06ee7b004824d  swazona-license-verify-darwin-arm64
          219247c196c429de965f1345920c7bba41fb4ff06aab246b3915ac98b7bc75dc  swazona-license-verify-linux-amd64
          0f4229758c19eab5236776ef6b823ceb610fe321c6291489bcd6cd5476ee43ae  swazona-license-verify-linux-arm64
      run: bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh"
    - name: Verify license (fail closed)
      id: license
      shell: bash
      env:
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWAZONA_LICENSE: ${{ inputs.license }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$RUN_DIR/bin/swazona-license-verify"'

    - name: Resolve Tier-D ruleset
      id: rules
      shell: bash
      env:
        SWZ_RULES_INPUT: ${{ inputs.rules }}
        SWZ_REPO_DIR: ${{ inputs.repo-dir }}
        SWZ_BASE: ${{ inputs.base }}
        SWZ_BUNDLED_RULES: ${{ github.action_path }}/rules/default.yml
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
      run: |
        set -euo pipefail
        if [ -z "$SWZ_RULES_INPUT" ]; then
          echo "path=$SWZ_BUNDLED_RULES" >> "$GITHUB_OUTPUT"
        else
          out="$RUN_DIR/rules.yml"
          git -C "$SWZ_REPO_DIR" show "$SWZ_BASE:$SWZ_RULES_INPUT" > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
        fi

    - name: Compute cache key
      id: cachekey
      shell: bash
      env:
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWZ_REPO_DIR: ${{ inputs.repo-dir }}
        SWZ_RULES: ${{ steps.rules.outputs.path }}
        SWZ_BASE: ${{ inputs.base }}
        SWZ_HEAD: ${{ inputs.head }}
        SWZ_FINDER_MODEL: ${{ inputs.finder-model }}
        SWZ_REFUTER_MODEL: ${{ inputs.refuter-model }}
      run: |
        set -euo pipefail
        rc=0
        out="$("$RUN_DIR/bin/swazona-gate" \
          --repo-dir "$SWZ_REPO_DIR" \
          --rules "$SWZ_RULES" \
          --base "$SWZ_BASE" \
          --head "$SWZ_HEAD" \
          --finder-model "$SWZ_FINDER_MODEL" \
          --refuter-model "$SWZ_REFUTER_MODEL" \
          --print-cache-key)" || rc=$?
        if [ "$rc" -ne 0 ] || [ -z "$out" ]; then
          echo "key=" >> "$GITHUB_OUTPUT"
        else
          echo "key=$out" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore verdict cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      if: steps.cachekey.outputs.key != ''
      with:
        path: ${{ runner.temp }}/swazona-gate-cache
        key: swazona-gate-verdict-v1-${{ steps.cachekey.outputs.key }}

    - name: Run swazona-gate
      id: gate
      shell: bash
      env:
        SWAZONA_LICENSE: ${{ inputs.license }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWZ_INVOCATION_ID: ${{ steps.prep.outputs.invocation_id }}
        SWZ_REPO_DIR: ${{ inputs.repo-dir }}
        SWZ_RULES: ${{ steps.rules.outputs.path }}
        SWZ_BASE: ${{ inputs.base }}
        SWZ_HEAD: ${{ inputs.head }}
        SWZ_DRY_RUN: ${{ inputs.dry-run }}
        SWZ_MODE: ${{ inputs.mode }}
        SWZ_BLOCK_MODEL: ${{ inputs.block-on-model-findings }}
        SWZ_FINDER_MODEL: ${{ inputs.finder-model }}
        SWZ_REFUTER_MODEL: ${{ inputs.refuter-model }}
        SWZ_FINDER_PRICE: ${{ inputs.finder-price }}
        SWZ_REFUTER_PRICE: ${{ inputs.refuter-price }}
        SWZ_MAX_MODEL_USD: ${{ inputs.max-model-usd }}
        SWZ_CACHE_KEY: ${{ steps.cachekey.outputs.key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
      run: |
        set -euo pipefail
        args=(
          --repo-dir "$SWZ_REPO_DIR"
          --rules "$SWZ_RULES"
          --base "$SWZ_BASE"
          --head "$SWZ_HEAD"
          --sha "$SWZ_HEAD"
          --mode "$SWZ_MODE"
          # Boolean flags go as one argument: Go's flag package would read
          # "--block-on-model-findings false" as the flag set true plus a
          # stray positional (gate_args_test.go pins this contract).
          --block-on-model-findings="$SWZ_BLOCK_MODEL"
          --finder-model "$SWZ_FINDER_MODEL"
          --refuter-model "$SWZ_REFUTER_MODEL"
          --finder-price "$SWZ_FINDER_PRICE"
          --refuter-price "$SWZ_REFUTER_PRICE"
          --max-model-usd "$SWZ_MAX_MODEL_USD"
          --cache-dir "$RUNNER_TEMP/swazona-gate-cache"
          --result-out "$RUN_DIR/result.json"
          --invocation-id "$SWZ_INVOCATION_ID"
          --defer-conclusion
        )
        if [ "$SWZ_DRY_RUN" = "true" ]; then
          "$RUN_DIR/bin/swazona-gate" --dry-run "${args[@]}" > "$RUN_DIR/gate-dry-run.json"
        else
          "$RUN_DIR/bin/swazona-gate" "${args[@]}"
        fi
        if [ -n "$SWZ_CACHE_KEY" ] && [ -f "$RUNNER_TEMP/swazona-gate-cache/$SWZ_CACHE_KEY.json" ]; then
          echo "cache_written=true" >> "$GITHUB_OUTPUT"
        else
          echo "cache_written=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save verdict cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      if: steps.gate.outcome == 'success' && steps.gate.outputs.cache_written == 'true' && steps.restore.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/swazona-gate-cache
        key: swazona-gate-verdict-v1-${{ steps.cachekey.outputs.key }}

    - name: Build evidence
      id: evidence
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWZ_INVOCATION_ID: ${{ steps.prep.outputs.invocation_id }}
        IN_ATTEST: ${{ inputs.attest }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        # The attestation probe and the evidence build are one step (A1: no
        # standalone probe step).
        "$RUN_DIR/bin/swazona-evidence" attest-probe --attest-mode "$IN_ATTEST" --dry-run "$IN_DRY_RUN"
        AV="$(grep '^available=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
        REASON="$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
        "$RUN_DIR/bin/swazona-evidence" build \
          --result "$RUN_DIR/result.json" \
          --out "$RUN_DIR/swazona-evidence.json" \
          --invocation-id "$SWZ_INVOCATION_ID" \
          --attest-mode "$IN_ATTEST" \
          --attest-available "$AV" \
          --attest-reason "$REASON"
        echo "available=$AV" >> "$GITHUB_OUTPUT"
        echo "reason=$REASON" >> "$GITHUB_OUTPUT"

    - name: Upload evidence artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
      if: inputs.dry-run != 'true'
      with:
        name: swazona-evidence-${{ steps.prep.outputs.invocation_id }}
        path: ${{ steps.prep.outputs.run_dir }}/swazona-evidence.json
        if-no-files-found: error
        retention-days: 90

    - name: Attest evidence
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3
      # A1: continue-on-error on this step only, and only in auto mode. With
      # attest=true there is no continue-on-error and a failure fails the run.
      continue-on-error: ${{ inputs.attest == 'auto' }}
      if: steps.evidence.outputs.available == 'true' && inputs.dry-run != 'true'
      with:
        subject-path: ${{ steps.prep.outputs.run_dir }}/swazona-evidence.json

    - name: Record attestation outcome
      id: record
      shell: bash
      # N01: A is recorded no matter how the attempt ended (item 13) — the
      # step must also survive a prep failure before run_dir existed.
      if: always()
      env:
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        ATTEST_MODE: ${{ inputs.attest }}
        ATTEST_AVAILABLE: ${{ steps.evidence.outputs.available }}
        ATTEST_REASON: ${{ steps.evidence.outputs.reason }}
        ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        ATTEST_ID: ${{ steps.attest.outputs.attestation-id }}
        ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_DIR" ]; then
          # Prep itself failed: no invocation, hence nothing to record.
          echo "::notice::prep did not run — no attestation record to write"
          exit 0
        fi
        mkdir -p "$RUN_DIR"
        sanitize() { printf '%s' "$1" | tr -d '\\"' | tr -c 'A-Za-z0-9 .:_/-' '?' | cut -c1-120; }
        if [ "$ATTEST_MODE" = "false" ]; then
          status=disabled
          reason="$(sanitize "attestation disabled for this run")"
          id=''; url=''
        elif [ "$ATTEST_AVAILABLE" != "true" ]; then
          status=unavailable
          reason="$(sanitize "$ATTEST_REASON")"
          id=''; url=''
        elif [ "$ATTEST_OUTCOME" = "success" ]; then
          status=succeeded
          reason=''
          id="$(sanitize "$ATTEST_ID")"; url="$(sanitize "$ATTEST_URL")"
        else
          # available=true and the attest step failed: only reachable in
          # auto mode (attest=true fails the run before this step).
          status=unavailable
          reason="$(sanitize "attestation step failed: $ATTEST_OUTCOME")"
          id=''; url=''
        fi
        # Keys must match gateevidence.AttestationOutcome (attestation_id /
        # attestation_url) — attestation_record_test.go runs this block and
        # decodes its output with the Go reader.
        printf '{"schema":"swazona-gate-attestation/1","status":"%s","reason":"%s","attestation_id":"%s","attestation_url":"%s"}\n' \
          "$status" "$reason" "$id" "$url" > "$RUN_DIR/attestation.json"

    - name: Upload attestation record
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
      # N01 (item 13): A is its own artifact after the attempt, failure or
      # not — only dry-run suppresses the upload.
      if: always() && inputs.dry-run != 'true'
      with:
        name: swazona-attestation-${{ steps.prep.outputs.invocation_id }}
        path: ${{ steps.prep.outputs.run_dir }}/attestation.json
        if-no-files-found: error
        retention-days: 90

    - name: Finalize check run
      id: finalize
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        RUN_DIR: ${{ steps.prep.outputs.run_dir }}
        SWZ_INVOCATION_ID: ${{ steps.prep.outputs.invocation_id }}
        SWZ_EVIDENCE_SHA256: ${{ steps.evidence.outputs.sha256 }}
        SWZ_PR_NUMBER: ${{ inputs.pr-number }}
        SWZ_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        SWZ_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=(
          --result "$RUN_DIR/result.json"
          --evidence "$RUN_DIR/swazona-evidence.json"
          --evidence-sha256 "$SWZ_EVIDENCE_SHA256"
          --invocation-id "$SWZ_INVOCATION_ID"
          --attestation-file "$RUN_DIR/attestation.json"
          --comment-author "$SWZ_COMMENT_AUTHOR"
        )
        if [ -n "$SWZ_PR_NUMBER" ]; then
          args+=(--pr-number "$SWZ_PR_NUMBER")
        fi
        if [ "$SWZ_DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        "$RUN_DIR/bin/swazona-evidence" finalize "${args[@]}"

    - name: Abort unfinished check run
      id: abort
      shell: bash
      # M9 pins this exact condition: a failure verdict exits 1 with
      # done=true already appended, so Abort never overwrites a verdict.
      if: failure() && steps.finalize.outputs.done != 'true'
      env:
        GHT: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_API: ${{ github.api_url }}
        SWZ_HEAD: ${{ inputs.head }}
        SWZ_MODE: ${{ inputs.mode }}
        SWZ_INVOCATION_ID: ${{ steps.prep.outputs.invocation_id }}
        SWZ_DRY_RUN: ${{ inputs.dry-run }}
        O_PREP: ${{ steps.prep.outcome }}
        O_BUILD: ${{ steps.build.outcome }}
        O_INTEGRITY: ${{ steps.build.outputs.integrity }}
        O_LICENSE: ${{ steps.license.outcome }}
        O_RULES: ${{ steps.rules.outcome }}
        O_GATE: ${{ steps.gate.outcome }}
        O_EVIDENCE: ${{ steps.evidence.outcome }}
        O_FINALIZE: ${{ steps.finalize.outcome }}
      run: |
        set -uo pipefail
        # B14: abort is inline shell using only curl, the run id and the
        # check name. It never reads R or E.
        FAILED=""
        for pair in "prep:$O_PREP" "build:$O_BUILD" "license:$O_LICENSE" "rules:$O_RULES" "gate:$O_GATE" "evidence:$O_EVIDENCE" "finalize:$O_FINALIZE"; do
          name="${pair%%:*}"; outcome="${pair#*:}"
          if [ "$outcome" = "failure" ]; then FAILED="$name"; break; fi
        done
        if [ -z "$FAILED" ]; then FAILED="upload or attestation"; fi
        # Abort integrity rule: a rendered public wrapper's install step signals
        # a verification failure (SHA256SUMS, signature or key mismatch) via
        # steps.build.outputs.integrity=failed. That escalates the generic
        # "build" failure to "build-integrity", which joins prep/license as
        # loud below. The source build step (plain Go compile) never sets
        # this output, so O_INTEGRITY stays empty and this is a no-op on main.
        if [ "$FAILED" = "build" ] && [ "${O_INTEGRITY:-}" = "failed" ]; then
          FAILED="build-integrity"
        fi
        # A2: license or input-validation (prep) failures are loud in every
        # mode; anything else before a verdict is failure (enforce) or
        # neutral (shadow). A build-integrity failure is loud too (tampering
        # must fail the check in every mode, shadow included).
        CONCLUSION="failure"
        if [ "$FAILED" != "prep" ] && [ "$FAILED" != "license" ] && [ "$FAILED" != "build-integrity" ] && [ "$SWZ_MODE" = "shadow" ]; then
          CONCLUSION="neutral"
        fi
        TITLE="swazona-gate: did not finish"
        SUMMARY="swazona-gate run failed before verdict: $FAILED. No verdict was published."
        sanitize() { printf '%s' "$1" | tr -d '\\"' | tr -c 'A-Za-z0-9 .:_/-' '?' | cut -c1-120; }
        TITLE="$(sanitize "$TITLE")"; SUMMARY="$(sanitize "$SUMMARY")"
        if [ "$SWZ_DRY_RUN" = "true" ]; then
          # Dry-run: no HTTP (ticket line 153). Write the dry-run abort
          # record instead of swazona-evidence-aborted.json (line 105) and
          # still exit 1 — the job was already failing.
          mkdir -p "$RUNNER_TEMP/swazona-gate-$SWZ_INVOCATION_ID"
          printf '{"schema":"swazona-gate-abort-dry-run/1","invocation_id":"%s","head_sha":"%s","failed_step":"%s","conclusion":"%s","title":"%s","summary":"%s"}\n' \
            "$(sanitize "$SWZ_INVOCATION_ID")" \
            "$SWZ_HEAD" \
            "$(sanitize "$FAILED")" \
            "$CONCLUSION" \
            "$TITLE" \
            "$SUMMARY" > "$RUNNER_TEMP/swazona-gate-$SWZ_INVOCATION_ID/abort-dry-run.json"
          echo "written=true" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        api() { # method path [json] — up to 4 tries, 1s/4s/9s apart; only 2xx is success
          method="$1"; path="$2"; data="${3:-}"
          n=0
          while [ $n -lt 4 ]; do
            rc=0
            if [ -n "$data" ]; then
              resp="$(curl -sS --max-time 30 -w $'\n%{http_code}' -X "$method" -H "Authorization: Bearer $GHT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data "$data" "$GH_API$path")" || rc=$?
            else
              resp="$(curl -sS --max-time 30 -w $'\n%{http_code}' -X "$method" -H "Authorization: Bearer $GHT" -H "Accept: application/vnd.github+json" "$GH_API$path")" || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              status="${resp##*$'\n'}"
              resp="${resp%$'\n'*}"
              case "$status" in
                2[0-9][0-9]) return 0 ;;
                429|5[0-9][0-9]) ;; # transient — fall through to the retry
                *) return 1 ;; # every other status is final
              esac
            fi
            n=$((n+1))
            if [ $n -lt 4 ]; then sleep $((n*n)); fi
          done
          return 1
        }
        # Find this job's OWN check run on the head sha: parse the REST
        # response as JSON and match on name + head sha + THIS invocation's
        # id (external_id, or a details_url carrying the id). No match →
        # RUN_ID stays empty and a NEW check run is created and concluded
        # per A2 below. Never fall back to the highest id: that could
        # complete another invocation's check (a shadow Abort neutralising
        # an enforce check — fix-round-2 item 1). Never a compact-field
        # regex or tail -1 over the raw response (fix-round item 2).
        RUN_ID=""
        if api GET "/repos/$GITHUB_REPOSITORY/commits/$SWZ_HEAD/check-runs?check_name=swazona-gate&status=in_progress"; then
          RUN_ID="$(printf '%s' "$resp" | jq -r --arg head "$SWZ_HEAD" --arg inv "$SWZ_INVOCATION_ID" '
            [.check_runs[]? | select(.name == "swazona-gate" and .head_sha == $head
              and $inv != "" and ((.external_id // "") == $inv or ((.details_url // "") | contains($inv))))]
            | first | if . == null then "" else (.id | tostring) end' || true)"
        fi
        ok=0
        if [ -n "$RUN_ID" ]; then
          BODY="{\"status\":\"completed\",\"conclusion\":\"$CONCLUSION\",\"output\":{\"title\":\"$TITLE\",\"summary\":\"$SUMMARY\"}}"
          if api PATCH "/repos/$GITHUB_REPOSITORY/check-runs/$RUN_ID" "$BODY"; then ok=1; fi
        else
          BODY="{\"name\":\"swazona-gate\",\"head_sha\":\"$SWZ_HEAD\",\"status\":\"completed\",\"conclusion\":\"$CONCLUSION\",\"output\":{\"title\":\"$TITLE\",\"summary\":\"$SUMMARY\"}}"
          if api POST "/repos/$GITHUB_REPOSITORY/check-runs" "$BODY"; then
            ok=1
            RUN_ID="$(printf '%s' "$resp" | jq -r '.id // empty' || true)"
          fi
        fi
        if [ "$ok" -ne 1 ]; then
          echo "::error::swazona-gate could not complete the check run: abort update failed for step $FAILED"
          exit 1
        fi
        # Fix-round-2 item 3: the record lives in THIS invocation's own
        # directory under a unique (invocation-suffixed) name — a shared
        # fixed-name file in RUNNER_TEMP lets a concurrent invocation's
        # upload pick up or clobber it — and written=true is announced only
        # after the write actually succeeded (the upload step's gate is
        # steps.abort.outputs.written == 'true').
        ABORT_DIR="$RUNNER_TEMP/swazona-gate-$SWZ_INVOCATION_ID"
        ABORT_FILE="$ABORT_DIR/swazona-evidence-aborted-$SWZ_INVOCATION_ID.json"
        mkdir -p "$ABORT_DIR"
        if printf '{"schema":"swazona-evidence-aborted/1","invocation_id":"%s","run":{"repository":"%s","run_id":%s,"run_attempt":%s,"workflow":"%s","event":"%s"},"head_sha":"%s","check_run":{"id":%s,"name":"swazona-gate"},"failed_step":"%s","reason":"%s","conclusion":"%s"}\n' \
          "$(sanitize "$SWZ_INVOCATION_ID")" \
          "$(sanitize "$GITHUB_REPOSITORY")" \
          "${GITHUB_RUN_ID:-0}" "${GITHUB_RUN_ATTEMPT:-0}" \
          "$(sanitize "${GITHUB_WORKFLOW:-unknown}")" \
          "$(sanitize "${GITHUB_EVENT_NAME:-unknown}")" \
          "$SWZ_HEAD" \
          "${RUN_ID:-0}" \
          "$(sanitize "$FAILED")" \
          "$(sanitize "$SUMMARY")" \
          "$CONCLUSION" > "$ABORT_FILE"; then
          echo "written=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::swazona-gate could not write the abort record $ABORT_FILE"
        fi
        exit 1

    - name: Upload aborted evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
      if: failure() && steps.abort.outputs.written == 'true' && inputs.dry-run != 'true'
      with:
        name: swazona-evidence-aborted-${{ steps.prep.outputs.invocation_id }}
        path: ${{ runner.temp }}/swazona-gate-${{ steps.prep.outputs.invocation_id }}/swazona-evidence-aborted-${{ steps.prep.outputs.invocation_id }}.json
        if-no-files-found: warn
        retention-days: 30
